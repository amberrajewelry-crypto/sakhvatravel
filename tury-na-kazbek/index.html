<div class="section">
  <h2 class="section-title">Маршрут тура на Казбек — точки по дороге</h2>
  <p class="section-sub">Военно-Грузинская дорога — 212 км истории и природы от Тбилиси до границы с Россией.</p>

  <div class="spots-grid">

    <div class="spot-card">
      <div class="spot-num">1</div>
      <h3>Замок Ананури (60 км от Тбилиси)</h3>
      <p>Крепость XII–XVII веков на берегу Жинвальского водохранилища. Две башни, старинная церковь с фресками и смотровая над бирюзовой водой. Замок охранял подходы к Тбилиси со стороны Кавказа. Вход свободный. Первая обязательная остановка по дороге в Казбеги — занимает 30–40 минут.</p>
    </div>

    <div class="spot-card">
      <div class="spot-num">2</div>
      <h3>Жинвальское водохранилище</h3>
      <p>Бирюзово-зелёная вода в горном ущелье — вид, который сложно передать словами. Водохранилище искусственное, создано в 1984 году. Под водой скрыто средневековое село Жинвали — в засушливые годы из-под воды выглядывают развалины башен. Лучшие виды — с дороги через 1–2 км после Ананури.</p>
    </div>

    <div class="spot-card">
      <div class="spot-num">3</div>
      <h3>Гудаури (100 км)</h3>
      <p>Горнолыжный курорт на высоте 2196 м. Зимой — остановка обязательна: 70 км трасс, подъёмники, виды на Главный Кавказский хребет. Летом — смотровая над Арагвским ущельем с параплан-площадкой. Температура в Гудаури летом +15–18°C — можно выйти и подышать горным воздухом после тбилисской жары.</p>
    </div>

    <div class="spot-card">
      <div class="spot-num">4</div>
      <h3>Степанцминда (Казбеги, 157 км)</h3>
      <p>Посёлок у подножия Казбека. Население около 2000 человек, большинство занято туристическим бизнесом. Здесь базируются гестхаусы, рестораны с видом на Казбек, прокат снаряжения. От центра посёлка до Гергетской Троицы — 1,5 часа пешком или 15 минут на джипе. Ночёвка здесь — это рассвет над Казбеком из окна.</p>
    </div>

    <div class="spot-card">
      <div class="spot-num">5</div>
      <h3>Гергетская Троица (2170 м)</h3>
      <p>Церковь Цминда Самеба XIV века — главная фотографическая точка Грузии. Стоит на зелёном холме на высоте 2170 м. Казбек (5047 м) за спиной. Внутри — средневековые фрески и часть утвари, спасённой во время войн. Вход свободный. Июль–август — очереди на джипы. Лучшее время — 7–9 утра или после 17:00.</p>
    </div>

    <div class="spot-card">
      <div class="spot-num">6</div>
      <h3>Ущелье Дарьяли</h3>
      <p>К северу от Степанцминды — ущелье реки Терек, уходящее к российской границе. Отвесные скалы высотой 400–500 м. Монастырь Дарьяли в скале. Один из самых узких проходов через Кавказский хребет — именно здесь проходил Великий Шёлковый путь. По запросу — добавляется к стандартному туру на Казбеги.</p>
    </div>

  </div>

  <h2 class="section-title">Когда ехать на Казбек</h2>
  <p class="section-sub">Дорога открыта круглый год — каждый сезон Казбеги разный.</p>

  <div class="usp-grid">
    <div class="usp-item">
      <div class="usp-icon">&#127793;</div>
      <h3>Весна (апрель–май)</h3>
      <p>Снег на вершинах, зелёные склоны, первые цветы. Туристов мало. Иногда дорога до Гергетской Троицы ещё закрыта — только пешком. Лучшее время для тех, кто хочет Казбеги без толпы.</p>
    </div>
    <div class="usp-item">
      <div class="usp-icon">&#9728;</div>
      <h3>Лето (июнь–август)</h3>
      <p>Зелёные альпийские луга, Казбек полностью виден. Июль–август — пик: очереди на джипы к Гергетской Троице. Выезд в 7:00 спасает. Температура в Казбеги: +18–22°C — идеально после тбилисской жары.</p>
    </div>
    <div class="usp-item">
      <div class="usp-icon">&#127810;</div>
      <h3>Осень (сентябрь–октябрь)</h3>
      <p>Золотые склоны и красный кустарник у подножия Казбека. Лучшее освещение для фотографий. Туристов меньше. Сентябрь — самый красивый месяц. Ночи уже холодные (0–5°C), день тёплый.</p>
    </div>
    <div class="usp-item">
      <div class="usp-icon">&#10052;</div>
      <h3>Зима (ноябрь–март)</h3>
      <p>Снежный Казбеги — тихий и атмосферный. Гудаури по дороге работает как горнолыжный курорт. Казбек полностью белый. Дорога открыта (зимой закрывают только при лавинах). Почти нет туристов.</p>
    </div>
  </div>

  <div class="info-box">
    <h3>Высотная болезнь — нужно ли беспокоиться?</h3>
    <p>Гергетская Троица находится на высоте 2170 м. На этой высоте у большинства людей нет никакого дискомфорта. Признаки лёгкой горной болезни (головная боль, лёгкое головокружение) возможны только у людей, впервые оказавшихся выше 2000 м. Пить больше воды, не бежать — и всё будет хорошо. Казбек (5047 м) — это уже альпинизм, в тур не входит.</p>
  </div>

<section class="faq-section">
  <h2>Часто задаваемые вопросы о туре на Казбек</h2>

  <div class="faq-item">
    <div class="faq-q" onclick="this.parentElement.classList.toggle('open')">Сколько стоит тур на Казбек из Тбилиси?</div>
    <div class="faq-a">Однодневный тур на Казбек из Тбилиси — от 7 700 ₽ (₾220) за человека при группе от 2 чел. В цену входит трансфер и услуги гида на весь день. 2-дневный тур Казбеги + Кахетия — от 19 250 ₽ (₾550/чел). Долина Трусо добавляется отдельно — от 9 100 ₽ (₾260/чел).</div>
  </div>

  <div class="faq-item">
    <div class="faq-q" onclick="this.parentElement.classList.toggle('open')">Сколько ехать из Тбилиси до Казбеги?</div>
    <div class="faq-a">Расстояние от Тбилиси до Степанцминды (Казбеги) — 157 км. На машине с гидом: 2,5–3 часа по Военно-Грузинской дороге с остановками у замка Ананури и Жинвальского водохранилища. Дорога живописная — время проходит незаметно.</div>
  </div>

  <div class="faq-item">
    <div class="faq-q" onclick="this.parentElement.classList.toggle('open')">Можно ли дойти до Гергетской Троицы пешком?</div>
    <div class="faq-a">Да, пеший подъём от Степанцминды до Гергетской Троицы — около 1,5–2 часов, 5 км, набор высоты 600 м. Тропа хорошо маркирована. Летом путь проходит по цветущим лугам. Джип нанимается на месте — около 20–25 ₾ туда-обратно. Гид помогает организовать и то, и другое.</div>
  </div>

  <div class="faq-item">
    <div class="faq-q" onclick="this.parentElement.classList.toggle('open')">Когда лучше ехать на Казбеги?</div>
    <div class="faq-a">Дорога открыта круглый год. Весна (апрель–май): снег + зелень, туристов мало. Лето (июнь–август): пик сезона, многолюдно, выезжать рано. Осень (сентябрь–октябрь): золотые склоны, лучшие фотографии, меньше людей. Зима (ноябрь–март): снежный Казбеги, тишина, Гудаури по дороге.</div>
  </div>

  <div class="faq-item">
    <div class="faq-q" onclick="this.parentElement.classList.toggle('open')">Что такое долина Трусо и стоит ли её посетить?</div>
    <div class="faq-a">Трусо — горная долина в 30 км от Казбеги вдоль реки Терек. Главная достопримечательность — цветные минеральные источники: летом они ярко-оранжевые от оксидов железа, зимой замерзают в причудливые формы. Ледник Тевдоре, средневековая церковь в горах. Маршрут малолюдный — большинство туристов не знают о нём. Добавляется к туру на Казбеги или как отдельный день.</div>
  </div>

</section>
