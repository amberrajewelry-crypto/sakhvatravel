.slide img,.slide video{width:100%;height:100%;object-fit:cover;display:block}
.label{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.5);color:#fff;font-size:10px;text-align:center;padding:3px}
</style>
