<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>V4a · Stripe Compact (live) — Бронирование</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#EFF1ED; --ink:#0D1411; --ink2:#566159; --ink3:#9AA39C; --line:#E6E9E3;
  --green:#0E5C3F; --green2:#15784F; --lime:#CFEF55; --mist:#F5F7F3;
  --ease:cubic-bezier(.32,.72,0,1);
}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
.stage{height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
@media(max-height:760px),(max-width:760px){body{overflow:auto}.stage{height:auto;min-height:100dvh;padding:70px 18px 40px}}
.topbar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:20px 28px}
.brand{font-weight:800;font-size:16px;letter-spacing:-.02em}.brand span{color:var(--green2)}
.topbar a{padding:8px 16px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12.5px;font-weight:700;text-decoration:none;color:var(--ink);transition:.3s var(--ease)}
.topbar a:hover{background:var(--green);color:#fff;border-color:var(--green)}

.card{width:100%;max-width:780px;background:#fff;border-radius:28px;box-shadow:0 40px 90px -46px rgba(13,20,17,.4);overflow:hidden}
.sum{display:flex;align-items:center;gap:14px;padding:18px 26px;color:#fff;position:relative;overflow:hidden;background:radial-gradient(90% 120% at 12% 0%,#1c8a5c,transparent 60%),linear-gradient(150deg,#0e5c3f,#0c2a1d)}
.sum .thumb{width:48px;height:48px;border-radius:14px;flex-shrink:0;position:relative;overflow:hidden;background:linear-gradient(150deg,#0a3526,#15784f)}
.sum .thumb svg{position:absolute;inset:0;margin:auto;opacity:.9}
.sum h2{font-size:17px;font-weight:800;letter-spacing:-.02em}
.sum .m{font-size:11.5px;color:rgba(255,255,255,.65);margin-top:1px}
.sum .pr{margin-left:auto;text-align:right}
.sum .pr b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.sum .pr s{display:block;font-size:11px;color:rgba(255,255,255,.5)}
.sum .save{position:absolute;right:26px;bottom:-1px;font-size:10px;font-weight:800;color:#0c2a1d;background:var(--lime);padding:3px 9px;border-radius:8px 8px 0 0;transition:opacity .3s}

.body{padding:20px 26px 24px}
.f-tour{margin-bottom:16px}
.f-tour label{display:block;font-size:11.5px;font-weight:700;margin-bottom:6px}
.tourbox{position:relative}
.tourbox .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none}
.inp{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--mist);font-family:inherit;font-size:14px;font-weight:500;color:var(--ink);outline:none;transition:.3s var(--ease)}
.inp::placeholder{color:var(--ink3)}
.inp:focus{border-color:var(--green2);background:#fff;box-shadow:0 0 0 4px rgba(21,120,79,.1)}
.inp.lg{padding:13px 14px 13px 42px;font-size:15px;font-weight:600}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:640px){.cols{grid-template-columns:1fr;gap:16px}}
.slab{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin-bottom:11px}
.f{margin-bottom:11px}
.f label{display:block;font-size:11.5px;font-weight:700;margin-bottom:6px}

.dates{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;margin-bottom:11px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.date{flex:0 0 auto;width:44px;padding:7px 0;border:1.5px solid var(--line);border-radius:12px;background:var(--mist);cursor:pointer;text-align:center;transition:transform .25s var(--ease),background .25s,border-color .25s}
.date span{display:block;font-size:9px;font-weight:700;text-transform:uppercase;color:var(--ink3)}
.date b{display:block;font-size:14px;font-weight:800;margin-top:1px}
.date.few b{color:#b06a12}
.date:hover{transform:translateY(-2px);background:#eef6f0}
.date.on{background:var(--green);border-color:var(--green);transform:translateY(-2px)}
.date.on span,.date.on b{color:#fff}
.datehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.datehead .mo{font-size:11.5px;font-weight:700}
.datehead .all{font-size:11px;font-weight:700;color:var(--green2);cursor:pointer;background:none;border:none;font-family:inherit}

.step{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--line);border-radius:12px;background:var(--mist);padding:5px 7px}
.step button{width:31px;height:31px;border:none;border-radius:9px;background:#fff;cursor:pointer;font-size:16px;color:var(--green);box-shadow:0 3px 8px -4px rgba(13,20,17,.3);transition:.2s var(--ease)}
.step button:hover{background:var(--green);color:#fff}
.step .val{font-size:15px;font-weight:800}

.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:11px}
.opt{border:1.5px solid var(--line);border-radius:12px;padding:9px 5px;cursor:pointer;background:var(--mist);text-align:center;transition:.3s var(--ease)}
.opt .ot{font-size:10px;font-weight:800}.opt .op{font-size:14px;font-weight:800;color:var(--green2);margin-top:2px}
.opt.on{border-color:var(--green);background:#fff;box-shadow:0 12px 22px -18px rgba(14,92,63,.5)}
.custom{margin-bottom:11px}

.ptabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.ptab{border:1.5px solid var(--line);border-radius:12px;padding:9px 5px;cursor:pointer;background:var(--mist);display:flex;flex-direction:column;align-items:center;gap:5px;transition:transform .35s var(--ease),border-color .35s,background .35s}
.ptab:hover{transform:translateY(-2px);background:#fff}
.ptab .pi{width:30px;height:30px;border-radius:9px;background:#fff;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center}
.ptab .pn{font-size:10px;font-weight:700}
.ptab.on{border-color:var(--green);background:#fff;box-shadow:0 12px 22px -18px rgba(14,92,63,.5)}
.ptab.on .pi{background:var(--green);border-color:var(--green)}.ptab.on .pi svg{stroke:#fff}

.foot{display:flex;align-items:center;gap:14px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.tot .k{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3)}
.tot .v{font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1}
.pay{margin-left:auto;display:flex;align-items:center;gap:11px;padding:14px 15px 14px 22px;border-radius:999px;background:var(--green);color:#fff;border:none;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;transition:transform .4s var(--ease),background .4s}
.pay:hover{background:var(--green2);transform:scale(1.03)}.pay:active{transform:scale(.98)}
.pay .pc{width:32px;height:32px;border-radius:50%;background:var(--lime);display:flex;align-items:center;justify-content:center;transition:transform .4s var(--ease)}
.pay:hover .pc{transform:translate(3px,-2px)}
.secure{text-align:center;font-size:11px;color:var(--ink3);font-weight:600;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:6px}
svg{display:block}
.card{opacity:0;transform:translateY(24px) scale(.99);filter:blur(7px);transition:opacity .85s var(--ease),transform .85s var(--ease),filter .85s var(--ease)}
.card.in{opacity:1;transform:none;filter:none}
</style>
</head>
<body>
<div class="topbar"><span class="brand">sakhva<span>·</span>travel</span><a href="#">Связаться</a></div>
<div class="stage">
  <div class="card">
    <div class="sum">
      <div class="thumb"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#CFEF55" stroke-width="1.4"><path d="M3 20l5-7 4 5 3-4 6 6"/><path d="M3 20h18"/><circle cx="8" cy="7" r="2"/></svg></div>
      <div><h2 id="sum-name">Выберите экскурсию</h2><div class="m" id="sum-meta">12 часов · ★ 4.9 · гид Тимур</div></div>
      <div class="pr"><b id="sum-price">₾—</b><s id="sum-old"></s></div>
      <span class="save" id="sum-save" style="opacity:0">↓ −₾0</span>
    </div>

    <div class="body">
      <div class="f-tour">
        <label>Экскурсия</label>
        <div class="tourbox">
          <span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA39C" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg></span>
          <input aria-label="Начните вводить название тура…" class="inp lg" id="f-tour" list="tours" placeholder="Начните вводить название тура…" autocomplete="off" value="Казбеги из Тбилиси">
        </div>
        <datalist id="tours"></datalist>
      </div>

      <div class="cols">
        <div>
          <div class="slab">Детали</div>
          <div class="f"><label>Имя</label><input aria-label="Имя" class="inp" placeholder="Ваше имя"></div>
          <div class="f"><label>WhatsApp / Telegram</label><input aria-label="WhatsApp / Telegram" class="inp" placeholder="+995 · @username"></div>
          <div class="f" style="margin-bottom:11px">
            <div class="datehead"><span class="mo">Дата · Июль 2026</span><button class="all" type="button">Весь месяц ▾</button></div>
            <div class="dates" id="dates"></div>
          </div>
          <div class="f" style="margin-bottom:0"><label>Гостей</label><div class="step"><button type="button" id="g-minus">−</button><span class="val" id="g-val">2</span><button type="button" id="g-plus">+</button></div></div>
        </div>
        <div>
          <div class="slab">Вариант оплаты</div>
          <div class="seg" id="seg">
            <div class="opt on" data-t="prepay"><div class="ot">Предоплата</div><div class="op" id="op-prepay">₾—</div></div>
            <div class="opt" data-t="full"><div class="ot">Полная</div><div class="op" id="op-full">₾—</div></div>
            <div class="opt" data-t="custom"><div class="ot">Другая</div><div class="op">₾…</div></div>
          </div>
          <input aria-label="Сумма в GEL" class="inp custom" id="f-custom" type="number" placeholder="Сумма в GEL" style="display:none">
          <div class="f"><label>Email для чека</label><input aria-label="Email для чека" class="inp" placeholder="email@example.com"></div>
          <div class="slab" style="margin-top:4px">Способ оплаты</div>
          <div class="ptabs" id="ptabs">
            <div class="ptab on"><div class="pi"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#15784f" stroke-width="1.4"><rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20"/></svg></div><div class="pn">Visa·MC</div></div>
            <div class="ptab"><div class="pi"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#15784f" stroke-width="1.4"><circle cx="12" cy="12" r="9"/><path d="M9 8h4.5a2.5 2.5 0 010 5H9m0 0h5.5a2.5 2.5 0 010 5H9M12 6v2m0 8v2"/></svg></div><div class="pn">Крипто</div></div>
            <div class="ptab"><div class="pi"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#15784f" stroke-width="1.4"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M9 7h6M9 11h6M12 17v.01"/></svg></div><div class="pn">СБП·QR</div></div>
          </div>
        </div>
      </div>

      <div class="foot">
        <div class="tot"><div class="k">К оплате сейчас</div><div class="v" id="due">₾—</div></div>
        <button class="pay" id="paybtn">Оплатить картой <span class="pc"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0c2a1d" stroke-width="1.7"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>
      </div>
      <div class="secure"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#15784f" stroke-width="1.6"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg> SSL 256-bit · Пока ничего не спишется без подтверждения · отмена 24ч</div>
    </div>
  </div>
</div>

<script>
var TOURS=[
 ["Казбеги из Тбилиси",175,220],["Кахетия из Тбилиси",170,215],["Мцхета из Тбилиси",77,95],
 ["Дегустация вина в Кахетии",225,280],["Боржоми из Тбилиси",178,225],["Гудаури из Тбилиси",225,280],
 ["Сванетия из Тбилиси",345,430],["Давид Гареджи",225,280],["Ананури из Тбилиси",175,220],
 ["Батуми из Тбилиси",250,315],["Ночной Тбилиси",94,120],["Старый Тбилиси",135,170],
 ["Сигнахи из Тбилиси",175,220],["Вардзия из Тбилиси",295,370],["Гори и Уплисцихе",155,195],
 ["Винный тур Тбилиси",165,205],["Тушетия",345,430],["Серные бани Тбилиси",135,170]];
var pmap={},omap={};
var dl=document.getElementById('tours');
TOURS.forEach(function(t){var o=document.createElement('option');o.value=t[0]+' — от ₾'+t[1];dl.appendChild(o);pmap[t[0]]=t[1];omap[t[0]]=t[2]});

// dates strip
var DOW=['пн','вт','ср','чт','пт','сб','вс'];var ds=document.getElementById('dates');
var base=new Date(2026,6,7);
for(var i=0;i<24;i++){var d=new Date(base.getTime()+i*86400000);var el=document.createElement('div');el.className='date'+(i===5?' on':'')+([4,11,18].indexOf(i)>=0?' few':'');el.innerHTML='<span>'+DOW[(d.getDay()+6)%7]+'</span><b>'+d.getDate()+'</b>';ds.appendChild(el)}

var guests=2,payType='prepay';
function curTour(){var v=document.getElementById('f-tour').value;var name=v.split(' — ')[0].trim();return pmap[name]?name:null}
function fmt(n){return '₾'+n}
function recalc(){
  var name=curTour();
  var sn=document.getElementById('sum-name'),sm=document.getElementById('sum-meta'),sp=document.getElementById('sum-price'),so=document.getElementById('sum-old'),sv=document.getElementById('sum-save');
  if(!name){sn.textContent='Выберите экскурсию';sp.textContent='₾—';so.textContent='';sv.style.opacity=0;
    document.getElementById('op-prepay').textContent='₾—';document.getElementById('op-full').textContent='₾—';document.getElementById('due').textContent='₾—';return}
  var per=pmap[name],oldper=omap[name];var total=per*guests,oldtotal=oldper*guests,prepay=Math.round(total*0.1);
  sn.textContent=name;sm.textContent='12 часов · ★ 4.9 · гид Тимур · '+guests+' гост.';
  sp.textContent=fmt(per);so.textContent=fmt(oldper);
  sv.textContent='↓ −'+fmt(oldtotal-total);sv.style.opacity=1;
  document.getElementById('op-prepay').textContent=fmt(prepay);
  document.getElementById('op-full').textContent=fmt(total);
  var due=payType==='prepay'?prepay:(payType==='full'?total:(parseInt(document.getElementById('f-custom').value)||0));
  document.getElementById('due').textContent=fmt(due);
}
document.getElementById('f-tour').addEventListener('input',recalc);
document.getElementById('g-plus').addEventListener('click',function(){if(guests<20)guests++;document.getElementById('g-val').textContent=guests;recalc()});
document.getElementById('g-minus').addEventListener('click',function(){if(guests>1)guests--;document.getElementById('g-val').textContent=guests;recalc()});
document.getElementById('f-custom').addEventListener('input',recalc);
document.querySelectorAll('#seg .opt').forEach(function(o){o.addEventListener('click',function(){
  document.querySelectorAll('#seg .opt').forEach(function(x){x.classList.remove('on')});o.classList.add('on');
  payType=o.getAttribute('data-t');document.getElementById('f-custom').style.display=payType==='custom'?'block':'none';recalc()})});
function bind(sel){document.querySelectorAll(sel).forEach(function(o){o.addEventListener('click',function(){o.parentNode.querySelectorAll(sel).forEach(function(x){x.classList.remove('on')});o.classList.add('on')})})}
bind('#dates .date');
document.querySelectorAll('#ptabs .ptab').forEach(function(o,i){o.addEventListener('click',function(){document.querySelectorAll('#ptabs .ptab').forEach(function(x){x.classList.remove('on')});o.classList.add('on');
  document.getElementById('paybtn').firstChild.textContent=(i===0?'Оплатить картой ':i===1?'Оплатить криптой ':'Оплатить по СБП ')})});
recalc();
requestAnimationFrame(function(){setTimeout(function(){document.querySelector('.card').classList.add('in')},80)});
</script>
</body>
</html>
