<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>V4c · Airbnb Card (live) — Бронирование</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#0D1411;--ink2:#566159;--ink3:#9AA39C;--line:#E9EBE6;--green:#0E5C3F;--green2:#15784F;--lime:#CFEF55;--mist:#F5F7F3;--ease:cubic-bezier(.32,.72,0,1)}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;background:radial-gradient(70% 60% at 20% 10%,rgba(52,160,110,.5),transparent 55%),radial-gradient(60% 60% at 95% 100%,rgba(207,239,85,.18),transparent 55%),linear-gradient(155deg,#0e5c3f,#0a2419);overflow:hidden}
.stage{height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
@media(max-height:800px){body{overflow:auto}.stage{height:auto;min-height:100dvh;padding:80px 24px 40px}}
.topbar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:22px 30px}
.brand{font-weight:800;font-size:16px;letter-spacing:-.02em;color:#fff}.brand span{color:var(--lime)}
.topbar a{padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(12px);color:#fff;font-size:12.5px;font-weight:700;text-decoration:none;transition:.3s var(--ease)}
.topbar a:hover{background:rgba(255,255,255,.2)}

.card{width:100%;max-width:440px;background:#fff;border-radius:30px;padding:24px;box-shadow:0 50px 100px -40px rgba(0,0,0,.6)}
.thead{display:flex;align-items:center;gap:13px;margin-bottom:16px}
.thumb{width:54px;height:54px;border-radius:16px;flex-shrink:0;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 20% 0%,#1c8a5c,transparent 60%),linear-gradient(150deg,#0c4a33,#0e5c3f)}
.thumb svg{position:absolute;inset:0;margin:auto}
.thead .ti h2{font-size:16px;font-weight:800;letter-spacing:-.02em}
.thead .ti .m{font-size:11.5px;color:var(--ink2);margin-top:2px}
.thead .pr{margin-left:auto;text-align:right}
.thead .pr b{font-size:18px;font-weight:800;color:var(--green);letter-spacing:-.02em}
.thead .pr s{display:block;font-size:11px;color:var(--ink3)}

.tourbox{position:relative;margin-bottom:13px}
.tourbox .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);pointer-events:none}
.inp{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--mist);font-family:inherit;font-size:14px;font-weight:500;color:var(--ink);outline:none;transition:.3s var(--ease)}
.inp::placeholder{color:var(--ink3)}
.inp:focus{border-color:var(--green2);background:#fff;box-shadow:0 0 0 4px rgba(21,120,79,.1)}
.inp.lg{padding:12px 13px 12px 40px;font-weight:600}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.f label{display:block;font-size:11.5px;font-weight:700;margin-bottom:6px}

.datehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.datehead .mo{font-size:11.5px;font-weight:700}
.datehead .all{font-size:11px;font-weight:700;color:var(--green2);cursor:pointer;background:none;border:none;font-family:inherit}
.dates{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;margin-bottom:12px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.date{flex:0 0 auto;width:48px;padding:8px 0;border:1.5px solid var(--line);border-radius:13px;background:var(--mist);cursor:pointer;text-align:center;transition:transform .25s var(--ease),background .25s,border-color .25s}
.date span{display:block;font-size:9.5px;font-weight:700;text-transform:uppercase;color:var(--ink3)}
.date b{display:block;font-size:15px;font-weight:800;margin-top:1px}
.date.few b{color:#b06a12}
.date:hover{transform:translateY(-2px);background:#eef6f0}
.date.on{background:var(--green);border-color:var(--green);transform:translateY(-2px);box-shadow:0 10px 18px -8px rgba(14,92,63,.6)}
.date.on span,.date.on b{color:#fff}

.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px}
.step{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--line);border-radius:12px;background:var(--mist);padding:5px 7px}
.step button{width:32px;height:32px;border:none;border-radius:9px;background:#fff;cursor:pointer;font-size:17px;color:var(--green);box-shadow:0 3px 8px -4px rgba(13,20,17,.3);transition:.2s var(--ease)}
.step button:hover{background:var(--green);color:#fff}
.step .val{font-size:16px;font-weight:800}

.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:11px}
.opt{border:1.5px solid var(--line);border-radius:12px;padding:9px 6px;cursor:pointer;background:var(--mist);text-align:center;transition:.3s var(--ease)}
.opt .ot{font-size:10.5px;font-weight:800}.opt .op{font-size:15px;font-weight:800;color:var(--green2);margin-top:2px}
.opt.on{border-color:var(--green);background:#fff;box-shadow:0 12px 24px -18px rgba(14,92,63,.5)}
.custom{margin-bottom:11px}

.ptabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.ptab{border:1.5px solid var(--line);border-radius:13px;padding:10px 6px;cursor:pointer;background:var(--mist);display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .35s var(--ease),border-color .35s,background .35s}
.ptab:hover{transform:translateY(-2px);background:#fff}
.ptab .pi{width:32px;height:32px;border-radius:10px;background:#fff;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center}
.ptab .pn{font-size:10.5px;font-weight:700}
.ptab.on{border-color:var(--green);background:#fff;box-shadow:0 12px 24px -18px rgba(14,92,63,.5)}
.ptab.on .pi{background:var(--green);border-color:var(--green)}.ptab.on .pi svg{stroke:#fff}

.pay{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:15px;border-radius:16px;background:var(--green);color:#fff;border:none;font-family:inherit;font-size:15.5px;font-weight:800;cursor:pointer;transition:transform .4s var(--ease),background .4s}
.pay:hover{background:var(--green2);transform:translateY(-2px)}.pay:active{transform:scale(.99)}
.pay .pc{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;transition:transform .4s var(--ease)}
.pay:hover .pc{transform:translate(3px,-1px)}
.hint{text-align:center;font-size:11.5px;color:var(--ink3);font-weight:600;margin-top:11px;display:flex;align-items:center;justify-content:center;gap:6px}
svg{display:block}
.card{opacity:0;transform:translateY(26px) scale(.98);filter:blur(8px);transition:opacity .9s var(--ease),transform .9s var(--ease),filter .9s var(--ease)}
.card.in{opacity:1;transform:none;filter:none}
</style>
</head>
<body>
<div class="topbar"><span class="brand">sakhva<span>·</span>travel</span><a href="#">Связаться</a></div>
<div class="stage">
  <div class="card">
    <div class="thead">
      <div class="thumb"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#CFEF55" stroke-width="1.4"><path d="M3 20l5-7 4 5 3-4 6 6"/><path d="M3 20h18"/><circle cx="8" cy="7" r="2"/></svg></div>
      <div class="ti"><h2 id="sum-name">Казбеги из Тбилиси</h2><div class="m" id="sum-meta">12 часов · ★ 4.9 · гид Тимур</div></div>
      <div class="pr"><b id="sum-price">₾175</b><s id="sum-old">₾220</s></div>
    </div>

    <div class="tourbox">
      <span class="ico"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9AA39C" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg></span>
      <input aria-label="Начните вводить название тура…" class="inp lg" id="f-tour" list="tours" placeholder="Начните вводить название тура…" autocomplete="off" value="Казбеги из Тбилиси">
      <datalist id="tours"></datalist>
    </div>

    <div class="r2">
      <div class="f"><label>Имя</label><input aria-label="Имя" class="inp" placeholder="Ваше имя"></div>
      <div class="f"><label>WhatsApp / TG</label><input aria-label="WhatsApp / TG" class="inp" placeholder="+995 · @user"></div>
    </div>

    <div class="datehead"><span class="mo">Дата · Июль 2026</span><button class="all" type="button">Весь месяц ▾</button></div>
    <div class="dates" id="dates"></div>

    <div class="row">
      <div class="f"><label>Гостей</label><div class="step"><button type="button" id="g-minus">−</button><span class="val" id="g-val">2</span><button type="button" id="g-plus">+</button></div></div>
      <div class="f"><label>Email для чека</label><input aria-label="Email для чека" class="inp" placeholder="email@…"></div>
    </div>

    <div class="seg" id="seg">
      <div class="opt on" data-t="prepay"><div class="ot">Предоплата</div><div class="op" id="op-prepay">₾35</div></div>
      <div class="opt" data-t="full"><div class="ot">Полная</div><div class="op" id="op-full">₾350</div></div>
      <div class="opt" data-t="custom"><div class="ot">Другая</div><div class="op">₾…</div></div>
    </div>
    <input aria-label="Сумма в GEL" class="inp custom" id="f-custom" type="number" placeholder="Сумма в GEL" style="display:none">

    <div class="ptabs" id="ptabs">
      <div class="ptab on"><div class="pi"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#15784f" stroke-width="1.4"><rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20"/></svg></div><div class="pn">Visa·MC</div></div>
      <div class="ptab"><div class="pi"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#15784f" stroke-width="1.4"><circle cx="12" cy="12" r="9"/><path d="M9 8h4.5a2.5 2.5 0 010 5H9m0 0h5.5a2.5 2.5 0 010 5H9M12 6v2m0 8v2"/></svg></div><div class="pn">Крипто</div></div>
      <div class="ptab"><div class="pi"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#15784f" stroke-width="1.4"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M9 7h6M9 11h6M12 17v.01"/></svg></div><div class="pn">СБП·QR</div></div>
    </div>

    <button class="pay" id="paybtn">Оплатить ₾35 <span class="pc"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>
    <div class="hint"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#15784f" stroke-width="1.6"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg> Пока ничего не спишется · отмена за 24 часа</div>
  </div>
</div>

<script>
var TOURS=[["Казбеги из Тбилиси",175,220],["Кахетия из Тбилиси",170,215],["Мцхета из Тбилиси",77,95],["Дегустация вина в Кахетии",225,280],["Боржоми из Тбилиси",178,225],["Гудаури из Тбилиси",225,280],["Сванетия из Тбилиси",345,430],["Давид Гареджи",225,280],["Ананури из Тбилиси",175,220],["Батуми из Тбилиси",250,315],["Ночной Тбилиси",94,120],["Старый Тбилиси",135,170],["Сигнахи из Тбилиси",175,220],["Вардзия из Тбилиси",295,370],["Гори и Уплисцихе",155,195],["Винный тур Тбилиси",165,205],["Тушетия",345,430],["Серные бани Тбилиси",135,170]];
var pmap={},omap={},dl=document.getElementById('tours');
TOURS.forEach(function(t){var o=document.createElement('option');o.value=t[0]+' — от ₾'+t[1];dl.appendChild(o);pmap[t[0]]=t[1];omap[t[0]]=t[2]});
var DOW=['пн','вт','ср','чт','пт','сб','вс'],ds=document.getElementById('dates'),base=new Date(2026,6,7);
for(var i=0;i<22;i++){var d=new Date(base.getTime()+i*86400000);var el=document.createElement('div');el.className='date'+(i===5?' on':'')+([4,11,18].indexOf(i)>=0?' few':'');el.innerHTML='<span>'+DOW[(d.getDay()+6)%7]+'</span><b>'+d.getDate()+'</b>';ds.appendChild(el)}
var guests=2,payType='prepay';
function curTour(){var v=document.getElementById('f-tour').value;var n=v.split(' — ')[0].trim();return pmap[n]?n:null}
function f(n){return '₾'+n}
function recalc(){
  var n=curTour();var sn=document.getElementById('sum-name'),sm=document.getElementById('sum-meta'),sp=document.getElementById('sum-price'),so=document.getElementById('sum-old');
  if(!n){sn.textContent='Выберите экскурсию';sp.textContent='₾—';so.textContent='';document.getElementById('op-prepay').textContent='₾—';document.getElementById('op-full').textContent='₾—';setPay('₾—');return}
  var per=pmap[n],oldper=omap[n],total=per*guests,prepay=Math.round(total*0.1);
  sn.textContent=n;sm.textContent='12 часов · ★ 4.9 · гид Тимур · '+guests+' гост.';sp.textContent=f(per);so.textContent=f(oldper);
  document.getElementById('op-prepay').textContent=f(prepay);document.getElementById('op-full').textContent=f(total);
  var due=payType==='prepay'?prepay:(payType==='full'?total:(parseInt(document.getElementById('f-custom').value)||0));
  setPay(f(due));
}
var payVerb='Оплатить';
function setPay(v){document.getElementById('paybtn').firstChild.textContent=payVerb+' '+v+' '}
document.getElementById('f-tour').addEventListener('input',recalc);
document.getElementById('g-plus').addEventListener('click',function(){if(guests<20)guests++;document.getElementById('g-val').textContent=guests;recalc()});
document.getElementById('g-minus').addEventListener('click',function(){if(guests>1)guests--;document.getElementById('g-val').textContent=guests;recalc()});
document.getElementById('f-custom').addEventListener('input',recalc);
document.querySelectorAll('#seg .opt').forEach(function(o){o.addEventListener('click',function(){document.querySelectorAll('#seg .opt').forEach(function(x){x.classList.remove('on')});o.classList.add('on');payType=o.getAttribute('data-t');document.getElementById('f-custom').style.display=payType==='custom'?'block':'none';recalc()})});
document.querySelectorAll('#dates .date').forEach(function(o){o.addEventListener('click',function(){document.querySelectorAll('#dates .date').forEach(function(x){x.classList.remove('on')});o.classList.add('on')})});
document.querySelectorAll('#ptabs .ptab').forEach(function(o,i){o.addEventListener('click',function(){document.querySelectorAll('#ptabs .ptab').forEach(function(x){x.classList.remove('on')});o.classList.add('on');payVerb=(i===0?'Оплатить':i===1?'Оплатить криптой':'Оплатить по СБП');recalc()})});
recalc();
requestAnimationFrame(function(){setTimeout(function(){document.querySelector('.card').classList.add('in')},80)});
</script>
</body>
</html>
