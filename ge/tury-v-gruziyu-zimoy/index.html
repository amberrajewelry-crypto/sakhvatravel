<!-- ===== FAQ ===== -->
<section class="faq-section">
  <h2>ხშირად დასმული კითხვები საქართველოში ზამთრის ტურებზე</h2>

  <div class="faq-item">
    <div class="faq-q" onclick="this.parentElement.classList.toggle('open')">ღირს თუ არა საქართველოში ზამთარში წასვლა?</div>
    <div class="faq-a">დიახ. ზამთარში საქართველოში სამი მთავარი პლიუსია: 1) გუდაური — კავკასიის ერთ-ერთი საუკეთესო სათხილამურო კურორტი. 2) ზამთრის თბილისი — მშვიდი, მყუდრო, ტურისტული ბრბოს გარეშე. 3) სასტუმროებისა და ტურების ფასები ზაფხულთან შედარებით 20–40%-ით დაბალია. ერთი მინუსი: მთის მარშრუტები (სვანეთი, თუშეთი) დახურულია.</div>
  </div>

  <div class="faq-item">
    <div class="faq-q" onclick="this.parentElement.classList.toggle('open')">როდის ჯობს გუდაურში წასვლა?</div>
    <div class="faq-a">გუდაურში სათხილამურო სეზონის პიკი — იანვრის შუა რიცხვებიდან მარტის ბოლომდე. დეკემბერში შეიძლება ცოტა თოვლი იყოს, აპრილში დათბობა იწყება. თებერვალი–მარტი — პიკი: შესანიშნავი თოვლი, მზიანი დღეები, კავკასიის ქედი ჰორიზონტზე. კურორტის სიმაღლე 2196–3007 მ გარანტიას იძლევა თოვლზე სეზონის შუა პერიოდში.</div>
  </div>

  <div class="faq-item">
    <div class="faq-q" onclick="this.parentElement.classList.toggle('open')">როგორ შეხვდეთ ახალ წელს თბილისში?</div>
    <div class="faq-a">თბილისი — ახალი წლისთვის ერთ-ერთი საუკეთესო ქალაქი: სადღესასწაულო გაფორმება, ცოცხალი მუსიკა რუსთაველზე, გასეირნება თავისუფლების მოედანზე. ქართველები ასევე აღნიშნავენ მართლმადიდებლურ შობას 7 იანვარს (შობა). ახალი წლის ტური გიდ თიმურთან მოიცავს შეხვედრას რესტორანში, სადღესასწაულო თბილისის გარშემო სეირნობასა და ექსკურსიებს 1–2 იანვარს.</div>
  </div>

  <div class="faq-item">
    <div class="faq-q" onclick="this.parentElement.classList.toggle('open')">როგორია ამინდი თბილისში ზამთარში?</div>
    <div class="faq-a">დეკემბერი–თებერვალი: 0–+8°C. თოვლი თბილისში ხდება, მაგრამ იშვიათად — სეზონში 2–3-ჯერ და სწრაფად ლღვება. სველი და흐მური. გოგირდის აბანოები და ცხელი ქართული ღვინო — ზამთრის თბილისური ყველაზე კარგი გართობა. გუდაურში კი -5–-15°C და შესანიშნავი თოვლი.</div>
  </div>

  <div class="faq-item">
    <div class="faq-q" onclick="this.parentElement.classList.toggle('open')">რა სხვა ნახოთ ზამთარში გუდაურის გარდა?</div>
    <div class="faq-a">თბილისში აბანოთუბნის გოგირდის აბანოები — მიწისქვეშა საბანაო აუზები ცხელი მინერალური წყლით. მცხეთის მონასტრები თოვლში ტურისტების გარეშე. ბორჯომი და მინერალური წყლის წყაროები. კახეთი ზამთარში — მყუდრო სიღნაღი და ოჯახური მარნები დეგუსტაციით. ბათუმი ზამთარში — ქალაქი ტურისტების გარეშე, +12°C და ცარიელი ბულვარი.</div>
