<!-- ===== FAQ ===== -->
<section class="faq-section">
  <h2>ხშირად დასმული კითხვები სვანეთში ტურებზე</h2>

  <div class="faq-item">
    <div class="faq-q" onclick="this.parentElement.classList.toggle('open')">რა ღირს ტური სვანეთში?</div>
    <div class="faq-a">ერთდღიანი ექსკურსია მესტიაში თბილისიდან — 12 250 ₽-დან (₾350/კაცი). 4-დღიანი ტური სვანეთი + უშგული — 42 000 ₽-დან (₾1200/კაცი), 3 ღამის გესტჰაუსში ცხოვრების ჩათვლით. სათავგადასავლო ტური მთიანი საქართველოს გასწვრივ (სვანეთი + თუშეთი) — 70 000 ₽-დან (₾2000/კაცი).</div>
  </div>

  <div class="faq-item">
    <div class="faq-q" onclick="this.parentElement.classList.toggle('open')">როგორ მივიდეთ თბილისიდან სვანეთში?</div>
    <div class="faq-a">თბილისიდან მესტიამდე — 430 კმ. მანქანით გიდით: 5–6 საათი ზუგდიდის გავლით. მარშრუტი: დიდუბის ავტოსადგურიდან, გამგზავრება 8:00-ზე, 6–7 საათი, დაახლოებით 45 ₾. თვითმფრინავი: ფრენები თბილისიდან (Vanilla Sky), 45 წუთი, 90 ₾-დან, მაგრამ განრიგი არარეგულარულია. გიდი ორგანიზებს ტრანსფერს მთელი მარშრუტისთვის.</div>
  </div>

  <div class="faq-item">
    <div class="faq-q" onclick="this.parentElement.classList.toggle('open')">როდის ჯობს სვანეთში წასვლა?</div>
    <div class="faq-a">საუკეთესო დრო — ივნისი–სექტემბერი. ივნისში მწვერვალებზე თოვლია, მწვანე მდელოები, ტურისტები ნაკლებია. ივლისი–აგვისტო — პიკი: მთები მწვანეში, მყინვარი ჩანს. სექტემბერი — ოქროსფერი ტყეები, ფოტოებისთვის საუკეთესო ფერები. ოქტომბერი — ბოლო თვე უშგულის გზის დახურვამდე. ზამთარში უშგულის გზა თოვლით არის დახურული.</div>
  </div>

  <div class="faq-item">
    <div class="faq-q" onclick="this.parentElement.classList.toggle('open')">რამდენი დღე სჭირდება სვანეთისთვის?</div>
    <div class="faq-a">მინიმუმ 3 დღე: 1 დღე გზა + მესტია, 1 დღე უშგული, 1 დღე დაბრუნება. ოპტიმალური 4 დღე: ემატება ჩალაათის მყინვარი ან ფეხით მარშრუტები. 1 დღეში თბილისიდან მხოლოდ მესტიის ნახვა შეიძლება — უშგულამდე ვერ მოასწრებთ. გიდი თიმური გირჩევთ 4-დღიან ფორმატს, როგორც სიღრმისა და კომფორტის ბალანსს.</div>
  </div>

  <div class="faq-item">
    <div class="faq-q" onclick="this.parentElement.classList.toggle('open')">რა არის სვანური კოშკები და რატომ აშენებდნენ მათ?</div>
    <div class="faq-a">სვანური კოშკები (კოში) — ქვის კოშკები სიმაღლით 20–28 მ, რომლებიც IX-დან XIII საუკუნემდე შენდებოდა. თითოეულ შეძლებულ გვარს ჰქონდა საკუთარი კოშკი თარეშებისა და სისხლის აღების წინააღმდეგ. კოშკოვანი სოფლები მესტია და უშგული UNESCO-ს მსოფლიო მემკვიდრეობის სიაშია შეტანილი. უშგულის კოშკები შხარის მყინვარის ფონზე — საქართველოს ერთ-ერთი ყველაზე ცნობადი ფოტო.</div>
  </div>

</section>
