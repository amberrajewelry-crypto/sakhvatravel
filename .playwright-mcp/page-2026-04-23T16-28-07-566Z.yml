  - generic [ref=e121]:
    - heading "Frequently Asked Questions" [level=2] [ref=e122]
    - generic [ref=e123]:
      - heading "How much does a private guide cost in Tbilisi?" [level=3] [ref=e124]
      - paragraph [ref=e125]: Our tours range from ₾90 (Mtskheta, approximately $33) to ₾700 (3-day Slow Travel Georgia). The most popular option is the Kazbegi day trip at ₾245 per person. All prices include transport, English-speaking guide, and entrance fees where applicable. No hidden costs.
    - generic [ref=e126]:
      - heading "What is the best day trip from Tbilisi?" [level=3] [ref=e127]
      - paragraph [ref=e128]: Kazbegi (Stepantsminda) is the most popular choice — a scenic 14-hour journey along the Georgian Military Highway. You will see Ananuri Fortress, the Gudauri viewpoint at 2395m, and Gergeti Trinity Church with Mt. Kazbek (5047m) in the background. For wine enthusiasts, the Kakheti tour visits Sighnaghi, Bodbe Monastery, and traditional qvevri wineries.
    - generic [ref=e129]:
      - heading "Is it worth hiring a private guide instead of a group tour?" [level=3] [ref=e130]
      - paragraph [ref=e131]: Group tours typically have 15-40 people, fixed schedules, and limited stops. With a private guide, you control the itinerary, spend more time at places you enjoy, and access hidden spots — narrow alleys, family-owned cellars, rooftop terraces — that large groups cannot visit. Our maximum is 6 people, so every tour feels personal.
    - generic [ref=e132]:
      - heading "Can I customize a tour?" [level=3] [ref=e133]
      - paragraph [ref=e134]: Yes. All tours can be adjusted based on your interests. Want to add a wine tasting to the Kazbegi trip? Or combine Old Tbilisi with a dinner experience? Message Timur on WhatsApp and he will create a custom itinerary at no extra planning fee.
    - generic [ref=e135]:
      - heading "What languages does the guide speak?" [level=3] [ref=e136]
      - paragraph [ref=e137]: Guide Timur is fluent in English and Russian. All tours are available in both languages. The booking process works via WhatsApp (+995 511 272 623) or Telegram (@sakhvatravel).
    - generic [ref=e138]:
      - heading "Do I need to pay in advance?" [level=3] [ref=e139]
      - paragraph [ref=e140]: No prepayment is required. You pay after the tour in Georgian Lari (GEL), USD, or EUR. Free cancellation up to 24 hours before the tour start time.
    - generic [ref=e141]:
      - heading "What should I bring on a Kazbegi day trip?" [level=3] [ref=e142]
      - paragraph [ref=e143]: Warm layers (it is 10-15°C colder at Gergeti elevation), comfortable hiking shoes, sunscreen, water, and a camera. Timur provides bottled water and snacks. The drive includes multiple photo stops along the Georgian Military Highway.
