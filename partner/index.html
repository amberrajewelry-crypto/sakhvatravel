<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Партнёрский кабинет — Sakhva Travel</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.ico">
<link rel="preload" href="/fonts/lora-10.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/lora-14.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Lora';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/lora-10.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Lora';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/lora-14.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Lora';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/lora-10.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Lora';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/lora-14.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Lora';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/lora-10.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Lora';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/lora-14.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#fafaf8;font-family:'Lora',Georgia,serif;color:#111827;-webkit-font-smoothing:antialiased;min-height:100vh}

/* Nav */
.nav{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,4vw,56px);background:#1A3D2E}
.nav-logo{color:#fff;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
.nav-tag{font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.5)}

.wrap{max-width:800px;margin:0 auto;padding:40px clamp(20px,4vw,48px) 100px}

/* Login */
.login{text-align:center;padding:100px 0 40px}
.login h1{font-size:clamp(24px,4.5vw,34px);color:#1A3D2E;font-weight:400;margin-bottom:8px}
.login p{color:#9CA3AF;font-size:14px;margin-bottom:36px}
.login-field{display:flex;flex-direction:column;align-items:center;gap:12px}
.login-input{width:100%;max-width:380px;padding:16px 24px;border:1px solid #E5E7EB;border-radius:12px;background:#fff;color:#111827;font-size:17px;font-family:'Lora',serif;text-align:center;outline:none;letter-spacing:.06em;transition:border-color .2s}
.login-input:focus{border-color:#1A3D2E}
.login-input::placeholder{color:#D1D5DB}
.login-btn{width:100%;max-width:380px;padding:15px;background:#1A3D2E;color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;font-family:'Lora',serif;cursor:pointer;letter-spacing:.08em;text-transform:uppercase;transition:background .2s}
.login-btn:hover{background:#245a3f}
.login-err{color:#EF4444;font-size:13px;margin-top:10px;display:none}

/* Dashboard */
.dash{display:none}

/* Header */
.dash-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;flex-wrap:wrap;gap:12px}
.dash-left{}
.dash-name{font-size:clamp(22px,4vw,30px);color:#111827;font-weight:400}
.dash-meta{display:flex;align-items:center;gap:12px;margin-top:4px}
.dash-slug{color:#1A3D2E;font-size:13px;font-weight:600}
.dash-date{color:#9CA3AF;font-size:12px}
.dash-promo{text-align:right}
.promo-code{font-size:20px;font-weight:700;color:#1A3D2E;letter-spacing:.18em}
.promo-label{font-size:9px;color:#9CA3AF;letter-spacing:.12em;text-transform:uppercase;margin-top:2px}

/* Link bar */
.link-bar{background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}
.link-url{color:#1A3D2E;font-size:14px;font-weight:600;word-break:break-all}
.copy-btn{background:#1A3D2E;color:#fff;border:none;padding:8px 20px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:'Lora',serif;letter-spacing:.06em;text-transform:uppercase;transition:background .2s}
.copy-btn:hover{background:#245a3f}

/* Metric cards */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:32px}
@media(max-width:520px){.cards{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid #E5E7EB;border-radius:14px;padding:24px 20px;text-align:center}
.card-num{font-size:clamp(32px,7vw,46px);font-weight:700;color:#111827;line-height:1;letter-spacing:-.02em}
.card-sub{font-size:9px;color:#9CA3AF;letter-spacing:.18em;text-transform:uppercase;margin-top:8px}
.card-num.green{color:#1A3D2E}

/* Chart */
.chart-section{background:#fff;border:1px solid #E5E7EB;border-radius:14px;padding:24px;margin-bottom:28px;display:none}
.chart-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.chart-title{font-size:16px;color:#111827;font-weight:600}
.chart-period{font-size:11px;color:#9CA3AF;letter-spacing:.06em}
.chart{display:flex;align-items:flex-end;gap:2px;height:120px}
.chart-bar{flex:1;background:#E0F0E8;border-radius:3px 3px 0 0;min-height:2px;transition:background .15s;position:relative;cursor:default}
.chart-bar:hover{background:#1A3D2E}
.chart-bar .tip{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#111827;color:#fff;font-size:10px;padding:4px 10px;border-radius:6px;white-space:nowrap;margin-bottom:6px;z-index:5}
.chart-bar:hover .tip{display:block}
.chart-dates{display:flex;justify-content:space-between;margin-top:8px}
.chart-dates span{font-size:10px;color:#D1D5DB}

/* Data grid */
.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:560px){.data-grid{grid-template-columns:1fr}}
.data-card{background:#fff;border:1px solid #E5E7EB;border-radius:14px;padding:20px}
.data-title{font-size:11px;font-weight:700;color:#9CA3AF;letter-spacing:.12em;text-transform:uppercase;margin-bottom:16px}
.tbl{width:100%;border-collapse:collapse}
.tbl td{padding:8px 0;border-bottom:1px solid #F3F4F6;font-size:13px;color:#374151}
.tbl tr:last-child td{border:none}
.tbl td:nth-child(1){color:#111827}
.tbl td:nth-child(2){text-align:right;font-weight:700;color:#111827;font-size:14px;width:50px}
.tbl td:nth-child(3){text-align:right;color:#D1D5DB;font-size:11px;width:36px}
.bar-cell{width:28%}
.bar-wrap{background:#F3F4F6;border-radius:3px;height:4px;width:100%}
.bar{background:#1A3D2E;height:4px;border-radius:3px;min-width:2px}

/* Logout */
.logout-btn{display:block;width:140px;margin:32px auto 0;padding:10px;background:transparent;color:#9CA3AF;border:1px solid #E5E7EB;border-radius:8px;font-size:11px;font-weight:700;font-family:'Lora',serif;cursor:pointer;letter-spacing:.1em;text-transform:uppercase;transition:all .2s}
.logout-btn:hover{color:#111827;border-color:#9CA3AF}
</style>
</head>
<body>
<div class="nav">
  <a href="/" class="nav-logo">Sakhva Travel</a>
  <span class="nav-tag">Partner</span>
</div>
<div class="wrap">
  <!-- Login -->
  <div class="login" id="login-view">
    <h1>Партнёрский кабинет</h1>
    <p>Введите код для просмотра статистики</p>
    <div class="login-field">
      <input type="text" class="login-input" id="slug-input" placeholder="Код партнёра" autocomplete="off" autofocus>
      <button class="login-btn" id="login-btn" onclick="loadStats()">Войти</button>
    </div>
    <div class="login-err" id="login-err">Партнёр не найден. Проверьте код.</div>
  </div>

  <!-- Dashboard -->
  <div class="dash" id="dash-view">
    <div class="dash-head">
      <div class="dash-left">
        <div class="dash-name" id="d-name"></div>
        <div class="dash-meta">
          <span class="dash-slug" id="d-slug"></span>
          <span class="dash-date" id="d-date"></span>
        </div>
      </div>
      <div class="dash-promo">
        <div class="promo-code" id="d-promo"></div>
        <div class="promo-label">Промокод</div>
      </div>
    </div>

    <div class="link-bar">
      <span class="link-url" id="d-url"></span>
      <button class="copy-btn" onclick="copyLink()">Копировать</button>
    </div>

    <div class="cards">
      <div class="card"><div class="card-num" id="d-today">0</div><div class="card-sub">Сегодня</div></div>
      <div class="card"><div class="card-num green" id="d-month">0</div><div class="card-sub">За 30 дней</div></div>
      <div class="card"><div class="card-num" id="d-total">0</div><div class="card-sub">Всего</div></div>
    </div>

    <div class="chart-section" id="chart-section">
      <div class="chart-head">
        <div class="chart-title">Клики</div>
        <div class="chart-period">Последние 30 дней</div>
      </div>
      <div class="chart" id="chart"></div>
      <div class="chart-dates" id="chart-dates"></div>
    </div>

    <div class="data-grid">
      <div class="data-card" id="sec-countries" style="display:none">
        <div class="data-title">Страны</div>
        <table class="tbl"><tbody id="tbl-countries"></tbody></table>
      </div>
      <div class="data-card" id="sec-cities" style="display:none">
        <div class="data-title">Города</div>
        <table class="tbl"><tbody id="tbl-cities"></tbody></table>
      </div>
      <div class="data-card" id="sec-browsers" style="display:none">
        <div class="data-title">Браузеры</div>
        <table class="tbl"><tbody id="tbl-browsers"></tbody></table>
      </div>
      <div class="data-card" id="sec-devices" style="display:none">
        <div class="data-title">Устройства</div>
        <table class="tbl"><tbody id="tbl-devices"></tbody></table>
      </div>
      <div class="data-card" id="sec-referrers" style="display:none">
        <div class="data-title">Источники</div>
        <table class="tbl"><tbody id="tbl-referrers"></tbody></table>
      </div>
      <div class="data-card" id="sec-social" style="display:none">
        <div class="data-title">Соцсети</div>
        <table class="tbl"><tbody id="tbl-social"></tbody></table>
      </div>
    </div>

    <button class="logout-btn" onclick="logout()">Выйти</button>
  </div>
</div>

<script>
var _slug='';
var inp=document.getElementById('slug-input');
inp.addEventListener('keydown',function(e){if(e.key==='Enter')loadStats()});

var saved=localStorage.getItem('partner_dash');
if(saved){inp.value=saved;loadStats()}

function loadStats(){
  var s=inp.value.trim().toLowerCase();
  if(!s)return inp.focus();
  _slug=s;
  document.getElementById('login-err').style.display='none';
  document.getElementById('login-btn').textContent='ЗАГРУЗКА...';
  document.getElementById('login-btn').disabled=true;

  fetch('/api/partner-stats?slug='+encodeURIComponent(s))
    .then(function(r){return r.json()})
    .then(function(d){
      document.getElementById('login-btn').textContent='ВОЙТИ';
      document.getElementById('login-btn').disabled=false;
      if(d.error){
        document.getElementById('login-err').style.display='block';
        return;
      }
      localStorage.setItem('partner_dash',s);
      showDash(d);
    })
    .catch(function(){
      document.getElementById('login-btn').textContent='ВОЙТИ';
      document.getElementById('login-btn').disabled=false;
      document.getElementById('login-err').style.display='block';
    });
}

function showDash(d){
  document.getElementById('login-view').style.display='none';
  document.getElementById('dash-view').style.display='block';

  document.getElementById('d-name').textContent=d.partner;
  document.getElementById('d-slug').textContent='sakhva.link/'+d.slug;
  document.getElementById('d-date').textContent='с '+new Date(d.created).toLocaleDateString('ru-RU');
  document.getElementById('d-url').textContent='https://sakhva.link/'+d.slug;
  document.getElementById('d-promo').textContent=d.slug.toUpperCase()+'10';

  document.getElementById('d-today').textContent=d.today||0;
  document.getElementById('d-month').textContent=d.last30days||0;
  document.getElementById('d-total').textContent=d.totalClicks||0;

  renderChart(d.timeline||[]);
  renderTable('sec-countries','tbl-countries',d.countries,d.last30days||d.totalClicks);
  renderTable('sec-cities','tbl-cities',d.cities,d.last30days||d.totalClicks);
  renderTable('sec-browsers','tbl-browsers',d.browsers,d.last30days||d.totalClicks);
  renderTable('sec-devices','tbl-devices',d.os,d.last30days||d.totalClicks);
  renderTable('sec-referrers','tbl-referrers',d.referrers,d.last30days||d.totalClicks);
  renderTable('sec-social','tbl-social',d.social,d.last30days||d.totalClicks);
}

function renderChart(timeline){
  if(!timeline||!timeline.length)return;
  document.getElementById('chart-section').style.display='';
  var el=document.getElementById('chart');
  el.innerHTML='';
  var max=Math.max.apply(null,timeline.map(function(x){return x.clicks||0}));
  if(max===0)max=1;
  timeline.forEach(function(item){
    var clicks=item.clicks||0;
    var h=Math.max(2,Math.round(clicks/max*110));
    var date=item.date||'';
    var parts=date.split('-');
    var short=parts.length>=3?(parts[2]+'.'+parts[1]):'';
    var bar=document.createElement('div');
    bar.className='chart-bar';
    bar.style.height=h+'px';
    bar.innerHTML='<span class="tip">'+short+': '+clicks+'</span>';
    el.appendChild(bar);
  });
  var dates=document.getElementById('chart-dates');
  if(timeline.length>1){
    var fmt=function(d){var p=d.split('-');return p.length>=3?(p[2]+'.'+p[1]):d};
    dates.innerHTML='<span>'+fmt(timeline[0].date||'')+'</span><span>'+fmt(timeline[timeline.length-1].date||'')+'</span>';
  }
}

function renderTable(secId,tblId,data,total){
  if(!data||!data.length)return;
  document.getElementById(secId).style.display='';
  var tb=document.getElementById(tblId);
  tb.innerHTML='';
  var max=Math.max.apply(null,data.map(function(x){return x.count||0}));
  data.slice(0,8).forEach(function(item){
    var name=item.name||'Прямой';
    var count=item.count||0;
    var pct=total>0?Math.round(count/total*100):0;
    var barW=max>0?Math.round(count/max*100):0;
    var tr=document.createElement('tr');
    tr.innerHTML='<td>'+name+'</td><td>'+count+'</td><td>'+pct+'%</td><td class="bar-cell"><div class="bar-wrap"><div class="bar" style="width:'+barW+'%"></div></div></td>';
    tb.appendChild(tr);
  });
}

function copyLink(){
  var url='https://sakhva.link/'+_slug;
  navigator.clipboard.writeText(url).then(function(){
    var btn=document.querySelector('.copy-btn');
    btn.textContent='Готово!';
    btn.style.background='#059669';
    setTimeout(function(){btn.textContent='Копировать';btn.style.background=''},1500);
  });
}

function logout(){
  localStorage.removeItem('partner_dash');
  document.getElementById('dash-view').style.display='none';
  document.getElementById('login-view').style.display='block';
  inp.value='';
  inp.focus();
}
</script>
</body>
</html>
