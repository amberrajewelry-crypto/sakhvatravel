<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Партнёрский кабинет — Sakhva Travel</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.ico">
<link rel="preload" href="/fonts/lora-10.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/lora-14.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Lora';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/lora-10.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Lora';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/lora-14.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Lora';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/lora-10.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Lora';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/lora-14.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Lora';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/lora-10.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Lora';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/lora-14.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

*{margin:0;padding:0;box-sizing:border-box}
html{background:#0a1628}
body{font-family:'Lora',Georgia,serif;color:#E5E7EB;min-height:100vh;-webkit-font-smoothing:antialiased;background:#0a1628}

/* Nav — exact match of main site */
.nav{position:sticky;top:0;z-index:100;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,3.5vw,56px);background:rgba(0,0,0,.35)}
.nav-logo{color:#fff;font-family:'Lora',Georgia,serif;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
.nav-tag{font-family:'Lora',Georgia,serif;font-size:12px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.6)}

.wrap{max-width:780px;margin:0 auto;padding:40px clamp(16px,3.5vw,56px) 100px}

/* Login */
.login{text-align:center;padding:80px 0 40px}
.login h1{font-family:'Lora',Georgia,serif;font-size:clamp(26px,5vw,40px);color:#fff;font-weight:400;margin-bottom:10px;letter-spacing:-.02em}
.login p{color:rgba(255,255,255,.5);font-size:15px;margin-bottom:40px}
.login-field{display:flex;flex-direction:column;align-items:center;gap:14px}
.login-input{width:100%;max-width:360px;padding:16px 24px;border:1.5px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(10,22,40,.65);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font-size:18px;font-family:'Lora',serif;text-align:center;outline:none;letter-spacing:.08em;transition:border-color .25s}
.login-input:focus{border-color:#F59E0B}
.login-input::placeholder{color:rgba(255,255,255,.25);letter-spacing:.04em}
.login-btn{width:100%;max-width:360px;padding:15px;background:#1A3D2E;color:#fff;border:none;border-radius:9999px;font-size:13px;font-weight:700;font-family:'Lora',serif;cursor:pointer;letter-spacing:.12em;text-transform:uppercase;transition:filter .2s,box-shadow .2s;box-shadow:0 4px 14px rgba(26,61,46,.35),inset 0 1px 0 rgba(255,255,255,.15)}
.login-btn:hover{filter:brightness(1.2)}
.login-err{color:#F87171;font-size:13px;margin-top:8px;display:none}

/* Dashboard */
.dash{display:none}

/* Glass card mixin */
.glass{background:rgba(10,22,40,.65);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);border-radius:16px}

/* Header */
.dash-head{margin-bottom:28px}
.dash-name{font-family:'Lora',Georgia,serif;font-size:clamp(24px,4.5vw,36px);color:#fff;font-weight:400;letter-spacing:-.02em}
.dash-meta{display:flex;align-items:center;gap:16px;margin-top:8px;flex-wrap:wrap}
.dash-slug{color:#F59E0B;font-size:14px;font-weight:600;letter-spacing:.04em}
.dash-date{color:rgba(255,255,255,.35);font-size:12px}

/* Link + Promo */
.link-promo{display:grid;grid-template-columns:1fr auto;gap:14px;margin-bottom:24px}
@media(max-width:560px){.link-promo{grid-template-columns:1fr}}
.copy-wrap{padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.copy-url{color:#F59E0B;font-size:15px;font-weight:600;word-break:break-all;letter-spacing:.02em}
.copy-btn{background:#1A3D2E;color:#fff;border:none;padding:9px 22px;border-radius:9999px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:'Lora',serif;letter-spacing:.1em;text-transform:uppercase;transition:filter .2s;box-shadow:0 2px 10px rgba(26,61,46,.4),inset 0 1px 0 rgba(255,255,255,.2)}
.copy-btn:hover{filter:brightness(1.2)}
.promo-box{padding:20px 32px;text-align:center;display:flex;flex-direction:column;justify-content:center;min-width:180px}
.promo-code{font-size:24px;font-weight:700;color:#F59E0B;letter-spacing:.2em}
.promo-label{font-size:9px;color:rgba(255,255,255,.35);letter-spacing:.15em;text-transform:uppercase;margin-top:6px}

/* Metric cards */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px}
@media(max-width:520px){.cards{grid-template-columns:1fr}}
.card{padding:24px 20px;text-align:center}
.card-num{font-size:clamp(32px,7vw,48px);font-weight:700;color:#fff;line-height:1;letter-spacing:-.02em}
.card-label{font-size:9px;color:rgba(255,255,255,.4);letter-spacing:.2em;text-transform:uppercase;margin-top:10px}
.card-num.accent{color:#F59E0B}

/* Chart */
.chart-wrap{padding:24px;margin-bottom:24px}
.sec-label{font-size:11px;font-weight:700;color:#F59E0B;letter-spacing:.15em;text-transform:uppercase;margin-bottom:4px}
.sec-label::before{content:'';display:inline-block;width:12px;height:2px;background:#F59E0B;margin-right:10px;vertical-align:middle}
.chart-title{font-family:'Lora',Georgia,serif;font-size:18px;color:#fff;font-weight:400;margin-bottom:20px}
.chart{display:flex;align-items:flex-end;gap:2px;height:130px;padding:0 2px}
.chart-bar{flex:1;background:linear-gradient(180deg,#1A3D2E 0%,rgba(26,61,46,.4) 100%);border-radius:4px 4px 0 0;min-height:2px;transition:all .2s;position:relative;cursor:default}
.chart-bar:hover{background:linear-gradient(180deg,#F59E0B 0%,rgba(245,158,11,.3) 100%)}
.chart-bar .tip{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;font-size:10px;padding:4px 10px;border-radius:8px;white-space:nowrap;margin-bottom:6px;z-index:5;backdrop-filter:blur(4px)}
.chart-bar:hover .tip{display:block}
.chart-dates{display:flex;justify-content:space-between;margin-top:10px;padding:0 2px}
.chart-dates span{font-size:10px;color:rgba(255,255,255,.3)}

/* Data sections */
.sections{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:560px){.sections{grid-template-columns:1fr}}
.sec-card{padding:20px}
.sec-card .sec-label{margin-bottom:2px}
.sec-card-title{font-family:'Lora',Georgia,serif;font-size:16px;color:#fff;font-weight:400;margin-bottom:16px}
.tbl{width:100%;border-collapse:collapse}
.tbl td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px;color:rgba(255,255,255,.7)}
.tbl tr:last-child td{border:none}
.tbl td:nth-child(2){text-align:right;font-weight:700;color:#fff;font-size:14px}
.tbl td:nth-child(3){text-align:right;color:rgba(255,255,255,.3);font-size:11px;width:40px}
.bar-wrap{background:rgba(255,255,255,.05);border-radius:3px;height:4px;width:100%}
.bar{background:linear-gradient(90deg,#F59E0B,rgba(245,158,11,.4));height:4px;border-radius:3px;min-width:2px}
.bar-cell{width:30%}

/* Logout */
.logout-btn{display:block;width:160px;margin:36px auto 0;padding:11px;background:transparent;color:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.08);border-radius:9999px;font-size:11px;font-weight:700;font-family:'Lora',serif;cursor:pointer;letter-spacing:.12em;text-transform:uppercase;transition:all .25s}
.logout-btn:hover{color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.2)}
</style>
</head>
<body>
<div class="nav">
  <a href="/" class="nav-logo">Sakhva Travel</a>
  <span class="nav-tag">Partner</span>
</div>
<div class="wrap">
  <!-- Login -->
  <div class="login" id="login-view">
    <h1>Партнёрский кабинет</h1>
    <p>Введите код для просмотра статистики</p>
    <div class="login-field">
      <input type="text" class="login-input" id="slug-input" placeholder="Код партнёра" autocomplete="off" autofocus>
      <button class="login-btn" id="login-btn" onclick="loadStats()">Войти</button>
    </div>
    <div class="login-err" id="login-err">Партнёр не найден. Проверьте код.</div>
  </div>

  <!-- Dashboard -->
  <div class="dash" id="dash-view">
    <div class="dash-head">
      <div class="dash-name" id="d-name"></div>
      <div class="dash-meta">
        <span class="dash-slug" id="d-slug"></span>
        <span class="dash-date" id="d-date"></span>
      </div>
    </div>

    <div class="link-promo">
      <div class="glass copy-wrap">
        <span class="copy-url" id="d-url"></span>
        <button class="copy-btn" onclick="copyLink()">Копировать</button>
      </div>
      <div class="glass promo-box">
        <div class="promo-code" id="d-promo"></div>
        <div class="promo-label">Промокод</div>
      </div>
    </div>

    <div class="cards">
      <div class="glass card"><div class="card-num" id="d-today">0</div><div class="card-label">Сегодня</div></div>
      <div class="glass card"><div class="card-num accent" id="d-month">0</div><div class="card-label">За 30 дней</div></div>
      <div class="glass card"><div class="card-num" id="d-total">0</div><div class="card-label">Всего</div></div>
    </div>

    <div class="glass chart-wrap" id="chart-section" style="display:none">
      <div class="sec-label">Аналитика</div>
      <div class="chart-title">Клики за 30 дней</div>
      <div class="chart" id="chart"></div>
      <div class="chart-dates" id="chart-dates"></div>
    </div>

    <div class="sections">
      <div class="glass sec-card" id="sec-countries" style="display:none">
        <div class="sec-label">Гео</div>
        <div class="sec-card-title">Страны</div>
        <table class="tbl"><tbody id="tbl-countries"></tbody></table>
      </div>
      <div class="glass sec-card" id="sec-cities" style="display:none">
        <div class="sec-label">Гео</div>
        <div class="sec-card-title">Города</div>
        <table class="tbl"><tbody id="tbl-cities"></tbody></table>
      </div>
      <div class="glass sec-card" id="sec-browsers" style="display:none">
        <div class="sec-label">Техно</div>
        <div class="sec-card-title">Браузеры</div>
        <table class="tbl"><tbody id="tbl-browsers"></tbody></table>
      </div>
      <div class="glass sec-card" id="sec-devices" style="display:none">
        <div class="sec-label">Техно</div>
        <div class="sec-card-title">Устройства</div>
        <table class="tbl"><tbody id="tbl-devices"></tbody></table>
      </div>
      <div class="glass sec-card" id="sec-referrers" style="display:none">
        <div class="sec-label">Трафик</div>
        <div class="sec-card-title">Источники</div>
        <table class="tbl"><tbody id="tbl-referrers"></tbody></table>
      </div>
      <div class="glass sec-card" id="sec-social" style="display:none">
        <div class="sec-label">Трафик</div>
        <div class="sec-card-title">Соцсети</div>
        <table class="tbl"><tbody id="tbl-social"></tbody></table>
      </div>
    </div>

    <button class="logout-btn" onclick="logout()">Выйти</button>
  </div>
</div>

<script>
var _slug='';
var inp=document.getElementById('slug-input');
inp.addEventListener('keydown',function(e){if(e.key==='Enter')loadStats()});

var saved=localStorage.getItem('partner_dash');
if(saved){inp.value=saved;loadStats()}

function loadStats(){
  var s=inp.value.trim().toLowerCase();
  if(!s)return inp.focus();
  _slug=s;
  document.getElementById('login-err').style.display='none';
  document.getElementById('login-btn').textContent='ЗАГРУЗКА...';
  document.getElementById('login-btn').disabled=true;

  fetch('/api/partner-stats?slug='+encodeURIComponent(s))
    .then(function(r){return r.json()})
    .then(function(d){
      document.getElementById('login-btn').textContent='ВОЙТИ';
      document.getElementById('login-btn').disabled=false;
      if(d.error){
        document.getElementById('login-err').style.display='block';
        return;
      }
      localStorage.setItem('partner_dash',s);
      showDash(d);
    })
    .catch(function(){
      document.getElementById('login-btn').textContent='ВОЙТИ';
      document.getElementById('login-btn').disabled=false;
      document.getElementById('login-err').style.display='block';
    });
}

function showDash(d){
  document.getElementById('login-view').style.display='none';
  document.getElementById('dash-view').style.display='block';

  document.getElementById('d-name').textContent=d.partner;
  document.getElementById('d-slug').textContent='sakhva.link/'+d.slug;
  document.getElementById('d-date').textContent='с '+new Date(d.created).toLocaleDateString('ru-RU');
  document.getElementById('d-url').textContent='https://sakhva.link/'+d.slug;
  document.getElementById('d-promo').textContent=d.slug.toUpperCase()+'10';

  document.getElementById('d-today').textContent=d.today||0;
  document.getElementById('d-month').textContent=d.last30days||0;
  document.getElementById('d-total').textContent=d.totalClicks||0;

  renderChart(d.timeline||[]);
  renderTable('sec-countries','tbl-countries',d.countries,d.last30days||d.totalClicks);
  renderTable('sec-cities','tbl-cities',d.cities,d.last30days||d.totalClicks);
  renderTable('sec-browsers','tbl-browsers',d.browsers,d.last30days||d.totalClicks);
  renderTable('sec-devices','tbl-devices',d.os,d.last30days||d.totalClicks);
  renderTable('sec-referrers','tbl-referrers',d.referrers,d.last30days||d.totalClicks);
  renderTable('sec-social','tbl-social',d.social,d.last30days||d.totalClicks);
}

function renderChart(timeline){
  if(!timeline||!timeline.length)return;
  document.getElementById('chart-section').style.display='';
  var el=document.getElementById('chart');
  el.innerHTML='';
  var max=Math.max.apply(null,timeline.map(function(x){return x.clicks||0}));
  if(max===0)max=1;
  timeline.forEach(function(item){
    var clicks=item.clicks||0;
    var h=Math.max(2,Math.round(clicks/max*120));
    var date=item.date||'';
    var parts=date.split('-');
    var short=parts.length>=3?(parts[2]+'.'+parts[1]):'';
    var bar=document.createElement('div');
    bar.className='chart-bar';
    bar.style.height=h+'px';
    bar.innerHTML='<span class="tip">'+short+': '+clicks+'</span>';
    el.appendChild(bar);
  });
  var dates=document.getElementById('chart-dates');
  if(timeline.length>1){
    var fmt=function(d){var p=d.split('-');return p.length>=3?(p[2]+'.'+p[1]):d};
    dates.innerHTML='<span>'+fmt(timeline[0].date||'')+'</span><span>'+fmt(timeline[timeline.length-1].date||'')+'</span>';
  }
}

function renderTable(secId,tblId,data,total){
  if(!data||!data.length)return;
  document.getElementById(secId).style.display='';
  var tb=document.getElementById(tblId);
  tb.innerHTML='';
  var max=Math.max.apply(null,data.map(function(x){return x.count||0}));
  data.slice(0,8).forEach(function(item){
    var name=item.name||'Прямой';
    var count=item.count||0;
    var pct=total>0?Math.round(count/total*100):0;
    var barW=max>0?Math.round(count/max*100):0;
    var tr=document.createElement('tr');
    tr.innerHTML='<td>'+name+'</td><td>'+count+'</td><td>'+pct+'%</td><td class="bar-cell"><div class="bar-wrap"><div class="bar" style="width:'+barW+'%"></div></div></td>';
    tb.appendChild(tr);
  });
}

function copyLink(){
  var url='https://sakhva.link/'+_slug;
  navigator.clipboard.writeText(url).then(function(){
    var btn=document.querySelector('.copy-btn');
    var old=btn.textContent;
    btn.textContent='Готово';
    btn.style.background='#F59E0B';
    btn.style.color='#0a1628';
    setTimeout(function(){btn.textContent=old;btn.style.background='';btn.style.color=''},1500);
  });
}

function logout(){
  localStorage.removeItem('partner_dash');
  document.getElementById('dash-view').style.display='none';
  document.getElementById('login-view').style.display='block';
  inp.value='';
  inp.focus();
}
</script>
</body>
</html>
