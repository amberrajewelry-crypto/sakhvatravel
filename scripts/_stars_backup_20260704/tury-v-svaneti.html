<div class="section">
  <h2 class="section-title">Что посмотреть в Сванетии</h2>
  <p class="section-sub">Местия, Ушгули, ледники, башни — шесть главных точек маршрута.</p>

  <div class="spots-grid">

    <div class="spot-card">

      <h3>Местия — столица Сванетии</h3>
      <p>Городок на высоте 1500 м — центр верхней Сванетии. Башни клана Маргиани, Этнографический музей с иконами X–XIV вв. и уникальными золотыми изделиями. Главная площадь с рестораном, где подают хачапури с яйцом и сванскую соль. Отсюда начинаются все маршруты в верхние сёла и к ледникам. Аэропорт Местии принимает малые самолёты.</p>
    </div>

    <div class="spot-card">
      <div class="spot-num">2</div>
      <h3>Ушгули — самое высокогорное село Европы</h3>
      <p>Четыре деревни на высоте 2200 м у подножия ледника Шхара (5068 м). Внесены в список Всемирного наследия ЮНЕСКО как «башенные сёла Сванетии». Башни Ушгули — самые известные фотографии Грузии: средневековые башни на фоне белого ледника. Зимой деревня практически отрезана от мира — дорога из Местии (45 км) закрывается снегом. Летом добраться можно за 1,5–2 часа на внедорожнике.</p>
    </div>

    <div class="spot-card">
      <div class="spot-num">3</div>
      <h3>Сванские башни — 1000 лет истории</h3>
      <p>Каменные башни высотой 20–28 м строились с IX по XIII век. Каждый зажиточный клан имел собственную башню для защиты от набегов и кровной мести — традиции, которая существовала в Сванетии до XX века. В Местии сохранилось около 30 башен, в Ушгули — около 20. Гид Тимур рассказывает историю конкретных семей и башен, а не просто показывает каменные постройки.</p>
    </div>

    <div class="spot-card">
      <div class="spot-num">4</div>
      <h3>Ледник Чалаати</h3>
      <p>Доступный ледник в 8 км от Местии — пешая прогулка 1,5–2 часа в одну сторону по лесной тропе. Конечная точка — язык ледника с голубоватым льдом и потоком талой воды. Один из немногих ледников Кавказа, к которому можно дойти пешком без альпинистского снаряжения. Летом вдоль тропы цветут рододендроны.</p>
    </div>

    <div class="spot-card">
      <div class="spot-num">5</div>
      <h3>Ледник Шхара — крупнейший на Кавказе</h3>

    </div>

<!-- ===== FAQ ===== -->
<section class="faq-section">
  <h2>Часто задаваемые вопросы о турах в Сванетию</h2>

  <div class="faq-item">
    <div class="faq-q" onclick="this.parentElement.classList.toggle('open')">Сколько стоит тур в Сванетию?</div>
    <div class="faq-a">Однодневная экскурсия в Местию из Тбилиси — от 12 250 ₽ (₾350/чел). 4-дневный тур Сванетия + Ушгули — от 42 000 ₽ (₾1200/чел), включая 3 ночи в гестхаусах. Приключенческий тур по горной Грузии (Сванетия + Тушетия) — от 70 000 ₽ (₾2000/чел).</div>
  </div>

  <div class="faq-item">
    <div class="faq-q" onclick="this.parentElement.classList.toggle('open')">Как добраться из Тбилиси в Сванетию?</div>
    <div class="faq-a">Из Тбилиси в Местию — 430 км. На машине с гидом: 5–6 часов через Зугдиди. Маршрутка: с автовокзала Дидубе, отправление в 8:00, 6–7 часов, около 45 ₾. Самолёт: рейсы из Тбилиси (Vanilla Sky), 45 минут, от 90 ₾, но расписание нерегулярное. Гид организует трансфер на весь маршрут.</div>
  </div>

  <div class="faq-item">
    <div class="faq-q" onclick="this.parentElement.classList.toggle('open')">Когда лучше ехать в Сванетию?</div>
    <div class="faq-a">Лучшее время — июнь–сентябрь. В июне снег на вершинах, зелёные луга, туристов меньше. Июль–август — пик: горы в зелени, ледник виден. Сентябрь — золотые леса, лучшие краски для фото. Октябрь — последний месяц до закрытия дороги в Ушгули. Зимой дорога в Ушгули закрыта снегом.</div>
  </div>

  <div class="faq-item">
    <div class="faq-q" onclick="this.parentElement.classList.toggle('open')">Сколько дней нужно для Сванетии?</div>
    <div class="faq-a">Минимум 3 дня: 1 день дорога + Местия, 1 день Ушгули, 1 день возвращение. Оптимально 4 дня: добавляется ледник Чалаати или пешие маршруты. За 1 день из Тбилиси можно увидеть только Местию — Ушгули не успеть. Гид Тимур рекомендует 4-дневный формат как баланс глубины и удобства.</div>
  </div>

  <div class="faq-item">
    <div class="faq-q" onclick="this.parentElement.classList.toggle('open')">Что такое сванские башни и почему их строили?</div>
    <div class="faq-a">Сванские башни (кош) — каменные башни высотой 20–28 м, которые строились с IX по XIII век. Каждый зажиточный клан имел свою башню для защиты от набегов и кровной мести. Башенные сёла Местия и Ушгули внесены в список Всемирного наследия ЮНЕСКО. Башни Ушгули на фоне ледника Шхара — одна из самых узнаваемых фотографий Грузии.</div>
  </div>

</section>
