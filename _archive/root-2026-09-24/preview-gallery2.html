<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@import url('/fonts/lora-14.woff2');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,serif;background:#fafaf8;color:#111827}
button{font-family:inherit;cursor:pointer;border:none}

/* Gallery section */
#gallery{background:#fafaf8;padding:0 0 56px}
.sec-title{font-size:clamp(20px,5.5vw,48px);font-weight:400;text-align:center;padding:40px 20px 24px}
.gallery-preview{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:1280px;margin:0 auto;padding:0 20px}
.gp-item{border-radius:12px;overflow:hidden;aspect-ratio:3/4;cursor:pointer;position:relative}
.gp-item img,.gp-item video{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.gp-item:hover img,.gp-item:hover video{transform:scale(1.04)}
.gallery-btn-wrap{text-align:center;margin-top:32px}
.btn-primary{display:inline-flex;align-items:center;gap:8px;background:#1A3D2E;color:#fff;padding:14px 36px;border-radius:9999px;font-size:14px;font-weight:700;letter-spacing:.04em;transition:background .2s,transform .15s;box-shadow:0 4px 14px rgba(26,61,46,.35)}
.btn-primary:hover{background:#145A38;transform:translateY(-1px)}

/* Modal */
#gallery-modal{display:none;position:fixed;inset:0;z-index:9100;background:rgba(11,24,18,.95);overflow-y:auto}
#gallery-modal.gm-open{display:block}
.gm-header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;position:sticky;top:0;background:rgba(11,24,18,.9);backdrop-filter:blur(10px);z-index:1;border-bottom:1px solid rgba(255,255,255,.08)}
.gm-title{font-family:Georgia,serif;color:#fff;font-size:18px;font-weight:600}
.gm-close{background:none;border:none;color:rgba(255,255,255,.7);font-size:32px;line-height:1;cursor:pointer;padding:0 4px;transition:color .2s}
.gm-close:hover{color:#fff}
.gm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:20px 20px 40px;max-width:1280px;margin:0 auto}
.gm-item{border-radius:10px;overflow:hidden;aspect-ratio:3/4}
.gm-item img,.gm-item video{width:100%;height:100%;object-fit:cover;display:block}
@media(max-width:900px){.gallery-preview{grid-template-columns:repeat(2,1fr)}.gm-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:580px){.gallery-preview{gap:6px;padding:0 12px}.gm-grid{grid-template-columns:repeat(2,1fr);gap:5px;padding:12px 12px 30px}}
</style>
</head>
<body>
<section id="gallery">
<h2 class="sec-title">Фотоотчёт с наших туров</h2>
<div class="gallery-preview">
  <div class="gp-item"><img src="/images/gallery-5.webp" alt=""></div>
  <div class="gp-item"><img src="/images/gallery-6.webp" alt=""></div>
  <div class="gp-item"><img src="/images/gallery-7.webp" alt=""></div>
  <div class="gp-item"><video autoplay muted loop playsinline><source src="/images/gallery-28.webm" type="video/webm"></video></div>
</div>
<div class="gallery-btn-wrap">
  <button onclick="openGalleryModal()" class="btn-primary">Смотреть все фото</button>
</div>

<div id="gallery-modal" role="dialog">
  <div class="gm-header">
    <span class="gm-title">Фотоотчёт с наших туров</span>
    <button class="gm-close" onclick="closeGalleryModal()">&times;</button>
  </div>
  <div class="gm-grid">
    <div class="gm-item"><img src="/images/gallery-1.webp?v=4" loading="lazy"></div>
    <div class="gm-item"><img src="/images/gallery-2.webp" loading="lazy"></div>
    <div class="gm-item"><img src="/images/gallery-3.webp?v=2" loading="lazy"></div>
    <div class="gm-item"><img src="/images/gallery-4.webp" loading="lazy"></div>
    <div class="gm-item"><img src="/images/gallery-5.webp" loading="lazy"></div>
    <div class="gm-item"><img src="/images/gallery-6.webp" loading="lazy"></div>
    <div class="gm-item"><img src="/images/gallery-7.webp" loading="lazy"></div>
    <div class="gm-item"><img src="/images/gallery-8.webp" loading="lazy"></div>
    <div class="gm-item"><img src="/images/gallery-9.webp" loading="lazy"></div>
    <div class="gm-item"><img src="/images/gallery-10.webp" loading="lazy"></div>
    <div class="gm-item"><img src="/images/gallery-11.webp" loading="lazy"></div>
    <div class="gm-item"><img src="/images/gallery-12.webp" loading="lazy"></div>
    <div class="gm-item"><img src="/images/gallery-13.webp?v=2" loading="lazy"></div>
    <div class="gm-item"><img src="/images/gallery-14.webp" loading="lazy"></div>
    <div class="gm-item"><img src="/images/gallery-15.webp" loading="lazy"></div>
    <div class="gm-item"><img src="/images/gallery-16.webp" loading="lazy"></div>
    <div class="gm-item"><video autoplay muted loop playsinline><source src="/images/gallery-17.webm" type="video/webm"></video></div>
    <div class="gm-item"><video autoplay muted loop playsinline><source src="/images/gallery-18.webm" type="video/webm"></video></div>
    <div class="gm-item"><video autoplay muted loop playsinline><source src="/images/gallery-19.webm" type="video/webm"></video></div>
    <div class="gm-item"><img src="/images/gallery-20.webp" loading="lazy"></div>
    <div class="gm-item"><img src="/images/gallery-21.webp" loading="lazy"></div>
    <div class="gm-item"><img src="/images/gallery-22.webp" loading="lazy"></div>
    <div class="gm-item"><img src="/images/gallery-23.webp" loading="lazy"></div>
    <div class="gm-item"><video autoplay muted loop playsinline><source src="/images/gallery-24.webm" type="video/webm"></video></div>
    <div class="gm-item"><img src="/images/gallery-25.webp" loading="lazy"></div>
    <div class="gm-item"><video autoplay muted loop playsinline><source src="/images/gallery-26.webm" type="video/webm"></video></div>
    <div class="gm-item"><video autoplay muted loop playsinline><source src="/images/gallery-27.webm" type="video/webm"></video></div>
    <div class="gm-item"><video autoplay muted loop playsinline><source src="/images/gallery-28.webm" type="video/webm"></video></div>
  </div>
</div>
</section>
<script>
function openGalleryModal(){
  var m=document.getElementById('gallery-modal');
  m.classList.add('gm-open');
  document.body.style.overflow='hidden';
  m.scrollTop=0;
  m.querySelectorAll('video').forEach(function(v){v.play().catch(function(){})});
}
function closeGalleryModal(){
  document.getElementById('gallery-modal').classList.remove('gm-open');
  document.body.style.overflow='';
  document.getElementById('gallery-modal').querySelectorAll('video').forEach(function(v){v.pause()});
}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeGalleryModal()});
</script>
</body>
</html>
